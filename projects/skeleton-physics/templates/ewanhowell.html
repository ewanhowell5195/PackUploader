This pack makes it so that when any of the skeleton entities die, instead of falling over to the side like normal, they collapse into a pile of bones!

<h2>The entities this applies to are as follows:</h2><ul><li>Skeleton</li><li>Skeleton Horse</li><li>Stray</li><li>Wither Skeleton</li><li>The Wither</li><li>The Bogged</li></ul><img src="https://i.imgur.com/TKOBnK8.gif" alt="Skeletons collapsing into a pile of bones">
